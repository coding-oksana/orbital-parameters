  <body>
    <div id="root"></div>
    <!-- Crawlers and users without JS still get meaningful content -->
    <noscript>
      <h1>Orbital Parameters – Interactive Keplerian Orbit Visualiser</h1>
      <p>
        An interactive tool for exploring the six Keplerian orbital elements:
        semi-major axis, eccentricity, inclination, right ascension of the
        ascending node (RAAN), argument of periapsis and true anomaly. It shows
        the orbit around Earth in 3D and as a 2D ground track, with presets for
        the ISS, Hubble, GPS, Molniya, geostationary and sun-synchronous orbits.
      </p>
